data:
  ticker: "^IBEX"
  start_date: "2007-01-01"       # longer history = better walk-forward
  end_date: null                 # null = today
  cache_dir: "data/cache"
  raw_dir: "data/raw"
  processed_dir: "data/processed"

multiasset:
  enabled: true
  tickers:
    sp500:   "^GSPC"      # S&P 500 — global risk-on/off
    dax:     "^GDAXI"     # DAX — European proxy
    stoxx50: "^STOXX50E"  # EURO STOXX 50 — most direct euro-area benchmark
    eurusd:  "EURUSD=X"   # Euro strength (Spain is EUR-denominated)
    vix:     "^VIX"       # US implied vol — fear index
    vstoxx:  "^V2TX"      # EURO STOXX 50 implied vol (VSTOXX proxy)
    brent:   "BZ=F"       # Energy prices (Spain energy exposure)
    usbond:  "^TNX"       # US 10y yield — macro rates
  lags: [1, 2, 5]         # lagged returns of each asset
  # level_assets: tickers that get level + z-score features (not just returns)
  level_assets: ["vix", "vstoxx"]

features:
  lags: [1, 2, 3, 5, 10, 21]
  windows: [5, 10, 21, 63]
  include_volume: true
  include_multiasset: true
  include_sentiment: false     # set true after V2 setup

targets:
  direction_1d: true
  direction_5d: true
  return_5d: true
  vol_regime: true

split:
  train_end: "2021-12-31"
  val_end: "2023-06-30"

walk_forward:
  initial_train_months: 36
  step_months: 3
  val_months: 3
  # max_train_months: null   = expanding window (default, trains on all history)
  # max_train_months: 48     = rolling 4-year window (more regime-adaptive)
  # Literature: rolling windows of 3-5 years are preferred for non-stationary
  # daily equity data; COVID 2020 should be included (not excluded) as it is
  # a genuine tail-risk regime the model must learn to handle.
  max_train_months: null

models:
  logistic_regression:
    C: 0.1
    max_iter: 1000
    class_weight: balanced
  random_forest:
    n_estimators: 300
    max_depth: 6
    min_samples_leaf: 20
    class_weight: balanced
    n_jobs: -1
  xgboost:
    n_estimators: 500
    max_depth: 4
    learning_rate: 0.01
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: logloss
    early_stopping_rounds: 30
  lgbm:
    n_estimators: 500
    max_depth: 4
    learning_rate: 0.01
    subsample: 0.8
    colsample_bytree: 0.8
  lstm:
    seq_len: 20
    hidden_size: 64
    num_layers: 2
    dropout: 0.3
    batch_size: 64
    lr: 0.001
    epochs: 100
    patience: 15
  ensemble:
    base_models: [xgboost, lgbm, random_forest]
    meta_model: logistic

backtest:
  transaction_cost_bps: 10
  min_confidence: 0.55
  position_sizing: fixed

persistence:
  model_dir: "results/models"
  predictions_dir: "results"

logging:
  level: INFO
  dir: "logs"
