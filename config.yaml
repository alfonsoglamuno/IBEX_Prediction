data:
  ticker: "^IBEX"
  start_date: "2007-01-01"       # longer history = better walk-forward
  end_date: null                 # null = today
  cache_dir: "data/cache"
  raw_dir: "data/raw"
  processed_dir: "data/processed"

multiasset:
  enabled: true
  tickers:
    sp500:   "^GSPC"      # S&P 500 — global risk-on/off
    dax:     "^GDAXI"     # DAX — European proxy
    stoxx50: "^STOXX50E"  # EURO STOXX 50 — most direct euro-area benchmark
    eurusd:  "EURUSD=X"   # Euro strength (Spain is EUR-denominated)
    vix:     "^VIX"       # US implied vol — fear index
    vstoxx:  "^V2TX"      # EURO STOXX 50 implied vol (VSTOXX proxy)
    brent:   "BZ=F"       # Energy prices (Spain energy exposure)
    usbond:  "^TNX"       # US 10y yield — macro rates
  lags: [1, 2, 5]         # lagged returns of each asset
  # level_assets: tickers that get level + z-score features (not just returns)
  level_assets: ["vix", "vstoxx"]

features:
  lags: [1, 2, 3, 5, 10, 21]
  windows: [5, 10, 21, 63]
  include_volume: true
  include_multiasset: true
  # Sentiment: Track A (full history baseline) vs Track B (sentiment era ablation)
  #   Track A — include_sentiment: false  → full history 2007–today, no sentiment cols
  #   Track B — include_sentiment: true   → restricted to sentiment_start_date onward
  # Enabled (Track B): uses RSS-loaded sentiment for recent data; NaN before start_date.
  # Rows before sentiment.start_date are dropped by dropna, restricting train to ~2016+.
  include_sentiment: true

sentiment:
  # First date with trustworthy RSS/archive coverage.
  # Dates before this are treated as NaN (archive unavailable), NOT 0 (no news).
  # Set this to the earliest date where you have: enough articles per day,
  # stable source mix, usable timestamps, and low duplication.
  # Default: 2016-01-01 — adjust based on actual archive coverage.
  start_date: "2016-01-01"
  days_back: 365               # how many days of news to load on each run
  lang: "es"                   # primary language: "es" | "en"
  backend: "auto"              # "auto" | "transformer" | "keyword"
  # Composite layer weights: IndexSent = α·direct + β·rollup + γ·macro
  # Literature basis: Tetlock (2007), Garcia (2013), Groß-Klußmann & Hautsch (2011)
  alpha: 0.50                  # direct IBEX35 mentions (highest priority)
  beta:  0.30                  # constituent roll-up (index-weight adjusted)
  gamma: 0.20                  # macro EU/Spain (ECB, rates, eurozone)

targets:
  direction_1d: true
  direction_5d: true
  return_5d: true
  vol_regime: true

split:
  train_end: "2021-12-31"
  val_end: "2023-06-30"

walk_forward:
  initial_train_months: 36
  step_months: 3
  val_months: 3
  # max_train_months: null   = expanding window (trains on all history)
  # max_train_months: 48     = rolling 4-year window (more regime-adaptive)
  # Literature: rolling 3-5 year windows preferred for non-stationary daily equity data.
  # COVID 2020 included by design (Giantsidi & Tarantola 2025 — genuine tail-risk regime).
  max_train_months: 48

models:
  logistic_regression:
    C: 0.1
    max_iter: 1000
    class_weight: balanced
  random_forest:
    n_estimators: 300
    max_depth: 6
    min_samples_leaf: 20
    class_weight: balanced
    n_jobs: -1
  xgboost:
    n_estimators: 500
    max_depth: 4
    learning_rate: 0.01
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: logloss
    early_stopping_rounds: 30
  lgbm:
    n_estimators: 500
    max_depth: 4
    learning_rate: 0.01
    subsample: 0.8
    colsample_bytree: 0.8
  lstm:
    seq_len: 20
    hidden_size: 64
    num_layers: 2
    dropout: 0.3
    batch_size: 64
    lr: 0.001
    epochs: 100
    patience: 15
  ensemble:
    base_models: [xgboost, lgbm, random_forest]
    meta_model: logistic

backtest:
  transaction_cost_bps: 10
  min_confidence: 0.55
  position_sizing: fixed

persistence:
  model_dir: "results/models"
  predictions_dir: "results"

logging:
  level: INFO
  dir: "logs"
